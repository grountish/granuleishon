<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>grnsh</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main>
    <div class="header-bar">
      <span class="logo">⌝</span>
      <span class="tagline"></span>
      <div class="preset-bar">
        <button id="presetSaveBtn" class="preset-save">Store</button>
        <div id="presetSlots" class="preset-slots"></div>
      </div>
      <div class="view-toggle" id="viewToggle">
        <button type="button" class="view-btn active" data-view="front">Front</button>
        <button type="button" class="view-btn" data-view="back">Back</button>
        <button type="button" class="view-btn" data-view="visual">Visual</button>
      </div>
      <div class="transport">
        <label class="tempo-box" for="bpmInput">
          <span class="tempo-label">BPM</span>
          <input id="bpmInput" class="tempo-input" type="number" min="40" max="240" step="1" value="120" />
        </label>
        <label class="input-box" for="inputDeviceSelect">
          <span class="input-label">Input</span>
          <select id="inputDeviceSelect" class="input-select"></select>
        </label>
        <button id="startBtn" class="primary">&#9654; Start input</button>
        <button id="transportStopBtn" class="transport-stop-btn" disabled>&#9632; Stop all</button>
        <button id="recordBtn" class="record-btn">Rec</button>
        <span id="status" class="status">idle</span>
      </div>
    </div>

    <div id="frontWorkspace" class="workspace">
      <div id="generators"></div>
      <div id="fx-chain"></div>
    </div>
    <div id="backPanel" class="back-panel hidden-panel"></div>
    <div id="visualPanel" class="visual-panel hidden-panel"></div>
  </main>

  <script src="main.js"></script>
</body>

</html>
