<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>grnsh</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main>
    <div class="header-bar">
      <div class="project-bar" id="projectBar">
        <button id="projectMenuBtn" class="project-menu-btn" type="button">
          <span id="projectMenuLabel">Projects</span>
          <span class="project-caret">&#9662;</span>
        </button>
        <div id="projectMenu" class="project-menu" hidden>
          <div class="project-save-row">
            <input id="projectNameInput" class="project-name-input" type="text"
              placeholder="project name" maxlength="40" spellcheck="false" autocomplete="off" />
            <button id="projectSaveBtn" class="project-save-btn" type="button">Save</button>
          </div>
          <button id="projectNewBtn" class="project-new" type="button">+ New blank project</button>
          <div class="project-file-row">
            <button id="projectExportBtn" class="project-file-btn" type="button"
              title="Download project as a file (settings + audio clips)">Export file</button>
            <button id="projectImportBtn" class="project-file-btn" type="button"
              title="Load a project from an exported file">Import file</button>
          </div>
          <input id="projectImportInput" type="file" accept=".json,application/json" hidden />
          <div id="projectList" class="project-list"></div>
        </div>
      </div>
      <div class="undo-bar">
        <button id="undoBtn" class="undo-btn" type="button" title="Undo (&#8984;Z)" disabled>&#8630;</button>
        <button id="redoBtn" class="undo-btn" type="button" title="Redo (&#8679;&#8984;Z)" disabled>&#8631;</button>
      </div>
      <div class="view-toggle" id="viewToggle">
        <button type="button" class="view-btn active" data-view="front" title="Music — instruments &amp; FX">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.6 9.4V2.2l4.8-1v7.2"/>
            <ellipse cx="3" cy="9.6" rx="1.7" ry="1.3" fill="currentColor" stroke="none"/>
            <ellipse cx="7.8" cy="8.6" rx="1.7" ry="1.3" fill="currentColor" stroke="none"/>
          </svg>
        </button>
        <button type="button" class="view-btn" data-view="back" title="Back — patching">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
            <circle cx="2.5" cy="3" r="1.5"/>
            <circle cx="9.5" cy="3" r="1.5"/>
            <path d="M2.5 4.5 C2.5 9.5, 9.5 9.5, 9.5 4.5"/>
          </svg>
        </button>
        <button id="mixerViewBtn" type="button" class="view-btn" data-view="mixer"
          title="Mixer — levels, pan &amp; channel EQ">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
            <path d="M2 2v8M6 2v8M10 2v8"/>
            <path d="M.8 7.5h2.4M4.8 4h2.4M8.8 6h2.4"/>
          </svg>
        </button>
        <button type="button" class="view-btn" data-view="song"
          title="Song — arrange blocks, probabilities &amp; jumps">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="6" r="4.6"/>
            <circle cx="6" cy="1.4" r="1.1" fill="currentColor" stroke="none"/>
            <circle cx="10.6" cy="6" r="1.1" fill="currentColor" stroke="none"/>
            <circle cx="6" cy="10.6" r="1.1" fill="currentColor" stroke="none"/>
            <circle cx="1.4" cy="6" r="1.1" fill="currentColor" stroke="none"/>
            <path d="M3.4 7.2 Q6 4.2 8.6 7.2"/>
          </svg>
        </button>
        <button type="button" class="view-btn" data-view="visual" title="Visual">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 6 C3 2.5, 9 2.5, 11 6 C9 9.5, 3 9.5, 1 6 Z"/>
            <circle cx="6" cy="6" r="1.5" fill="currentColor" stroke="none"/>
          </svg>
        </button>
        <button type="button" class="view-btn" data-view="master"
          title="Master — polish the bounced audio">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 6h1.4l1-2.6 1.5 5.2 1.4-4 .9 2.4 .9-1H11"/>
          </svg>
        </button>
      </div>
      <div id="loopStrip" class="loop-strip">
        <div id="loopsBar" class="loops-bar"></div>
        <div id="songLane" class="song-lane" hidden></div>
      </div>
      <div id="masterHeaderSlot" class="master-header-slot" hidden></div>
      <div class="transport">
        <div class="mode-toggle" id="modeToggle">
          <button type="button" class="mode-btn active" data-mode="loop" title="Loop mode — play the loop you are editing">Loop</button>
          <button type="button" class="mode-btn" data-mode="song" title="Song mode — play the arrangement">Song</button>
        </div>
        <div class="tempo-box" title="Tempo — drag vertically, double-click to type">
          <input id="bpmInput" class="tempo-input" type="number" min="40" max="240" step="1" value="120" readonly />
        </div>
        <div class="settings-bar" id="settingsBar">
          <button id="settingsMenuBtn" class="settings-menu-btn" type="button" title="Input, theme, mic gate &amp; shortcuts">&#9881;</button>
          <dialog id="settingsMenu" class="settings-modal">
            <label class="input-box" for="inputDeviceSelect">
              <span class="input-label">Input</span>
              <select id="inputDeviceSelect" class="input-select"></select>
            </label>
            <label class="input-box" for="themeSelect">
              <span class="input-label">Theme</span>
              <select id="themeSelect" class="input-select">
                <option value="original">Original</option>
                <option value="sober">Sober</option>
                <option value="slate-arrangement">Slate Arrangement</option>
                <option value="slate-session">Slate Session</option>
                <option value="neon-flux">Neon Flux</option>
                <option value="aurora">Aurora</option>
                <option value="acid-circuit">Acid Circuit</option>
                <option value="solar-ritual">Solar Ritual</option>
              </select>
            </label>
            <label class="input-box" for="bounceModeSelect">
              <span class="input-label">Bounce</span>
              <select id="bounceModeSelect" class="input-select">
                <option value="master">Master only</option>
                <option value="stems">Master + stems</option>
              </select>
            </label>
            <label class="input-box" for="bounceCapSelect"
              title="Longest a song bounce may run before it stops and saves — protects against endless jump cycles">
              <span class="input-label">Bounce cap</span>
              <select id="bounceCapSelect" class="input-select">
                <option value="auto">Auto (4&#215; song)</option>
                <option value="60">1 min</option>
                <option value="120">2 min</option>
                <option value="300">5 min</option>
                <option value="600">10 min</option>
                <option value="1200">20 min</option>
              </select>
            </label>
            <label class="gate-box" for="tooltipsEnable">
              <input id="tooltipsEnable" class="gate-enable" type="checkbox" checked />
              <span class="gate-label">Tooltips</span>
            </label>
            <label class="gate-box" for="soloAdditiveEnable"
              title="On: solos stack up. Off: soloing an instrument silences all others">
              <input id="soloAdditiveEnable" class="gate-enable" type="checkbox" checked />
              <span class="gate-label">Additive solo</span>
            </label>
            <div class="link-box"
              title="Sync tempo &amp; phase with another machine on your network — enter the same room name on both, then press Link">
              <span class="input-label">Link</span>
              <input id="linkRoomInput" class="link-room-input" type="text" placeholder="room"
                maxlength="24" spellcheck="false" autocomplete="off" />
              <button id="linkConnectBtn" class="link-btn" type="button">Link</button>
              <span id="linkStatus" class="link-status">off</span>
            </div>
            <label class="gate-box" for="gateThreshold" title="Mute mic into the granulator below this threshold">
              <input id="gateEnable" class="gate-enable" type="checkbox" />
              <span class="gate-label">Mic Gate</span>
              <input id="gateThreshold" class="gate-slider" type="range" min="-60" max="0" step="1" value="-40" disabled />
              <span id="gateThresholdVal" class="gate-val">-40 dB</span>
            </label>
            <div class="shortcut-list">
              <div class="settings-section-label">Shortcuts</div>
              <div class="shortcut-row"><kbd>space</kbd><span>play / stop</span></div>
              <div class="shortcut-row"><kbd>tab</kbd><span>music / back / mixer / song</span></div>
              <div class="shortcut-row"><kbd>&#8984; ,</kbd><span>options</span></div>
              <div class="shortcut-row"><kbd>&#8984; s</kbd><span>save project</span></div>
              <div class="shortcut-row"><kbd>&#8984; z</kbd><span>undo</span></div>
              <div class="shortcut-row"><kbd>&#8679;&#8984; z</kbd><span>redo</span></div>
            </div>
          </dialog>
        </div>
        <button id="stripPlayBtn" class="strip-play-btn" type="button">&#9654;</button>
        <button id="recordBtn" class="record-btn" type="button" title="Start recording"
          aria-label="Start recording" aria-pressed="false">&#9679;</button>
        <button id="bounceBtn" class="bounce-btn"
          title="Bounce song to WAV — silent one-pass render of the arrangement">&#10515;</button>
        <div id="bounceProgress" class="bounce-progress" role="progressbar"
          aria-label="Bounce progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
          <span id="bounceProgressFill" class="bounce-progress-fill"></span>
          <span id="bounceProgressLabel" class="bounce-progress-label">0%</span>
        </div>
        <span id="status" class="status">idle</span>
      </div>
    </div>

    <div id="frontWorkspace" class="workspace">
      <div id="generators"></div>
      <div id="fx-chain"></div>
    </div>
    <div id="backPanel" class="back-panel hidden-panel"></div>
    <div id="visualPanel" class="visual-panel hidden-panel"></div>
    <div id="mixerPanel" class="mixer-panel hidden-panel"></div>
    <div id="songPanel" class="song-panel-view hidden-panel"></div>
    <div id="masterPanel" class="master-panel hidden-panel"></div>
  </main>

  <dialog id="confirmDialog" class="confirm-modal">
    <div id="confirmDialogMsg" class="confirm-msg"></div>
    <div class="confirm-actions">
      <button id="confirmDialogCancel" type="button">Cancel</button>
      <button id="confirmDialogOk" class="confirm-ok" type="button">OK</button>
    </div>
  </dialog>

  <script src="main.js"></script>
</body>

</html>
